name: Test
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: Optional uvu test file pattern
        required: false
        default: ''
permissions:
  contents: read
jobs:
  full:
    name: Node.js Latest Full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10
      - name: Install Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 25
          cache: pnpm
      - name: Pin the registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2025-12-03T16:22:25.708000Z
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Run tests
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: '1'
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            NODE_ENV=test ./node_modules/.bin/uvu test "${{ inputs.test-filter }}"
          else
            pnpm test
          fi
      - name: Pack the tarball
        run: |
          npx clean-publish --without-publish --temp-dir "$RUNNER_TEMP/clean-package"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd "$RUNNER_TEMP/clean-package"
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"
      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist/browserslist-*.tgz
          if-no-files-found: error
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version:
          - 24
          - 22
          - 20
          - 18
    name: Node.js ${{ matrix.node-version }} Quick
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Pin the registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2025-12-03T16:22:25.708000Z
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Run unit tests
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: '1'
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            NODE_ENV=test ./node_modules/.bin/uvu test "${{ inputs.test-filter }}"
          else
            pnpm unit
          fi
  old:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version:
          - 16
          - 14
          - 12
          - 10
          - 8
    name: Node.js ${{ matrix.node-version }} Quick
    steps:
      - name: Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 3
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Pin the registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2025-12-03T16:22:25.708000Z
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Run unit tests
        if: matrix.node-version >= 14
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: '1'
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            NODE_ENV=test ./node_modules/.bin/uvu test "${{ inputs.test-filter }}"
          else
            pnpm run unit
          fi
      # cache, custom, extends and shareable-stats tests require fs-extra 11
      # (engines >=14.14), which cannot load on Node.js 12.
      - name: Run unit tests (Node.js 12 subset)
        if: matrix.node-version == 12
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: '1'
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            NODE_ENV=test ./node_modules/.bin/uvu test "${{ inputs.test-filter }}"
          else
            NODE_ENV=test ./node_modules/.bin/uvu test '^(?!cache|custom|extends|shareable-stats).*\.test\.js$'
          fi
      # uvu 0.5.6's CLI runner reads globalThis (uvu/run/index.js) before its
      # polyfill, so it cannot start on Node.js < 12. An ES5 smoke check
      # exercises the public API (index.js / node.js) instead.
      - name: Run the legacy Node.js smoke test
        if: matrix.node-version < 12
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: '1'
        run: |
          cat > "$RUNNER_TEMP/old-node-smoke.js" <<'SMOKE'
          var assert = require('assert');
          var fs = require('fs');
          var os = require('os');
          var browserslist = require(process.cwd() + '/index.js');

          var passed = 0;
          var failed = 0;
          var index = 0;

          function check(name, fn) {
            index += 1;
            try {
              fn();
              passed += 1;
              console.log('ok ' + index + ' - ' + name);
            } catch (e) {
              failed += 1;
              process.exitCode = 1;
              console.log('not ok ' + index + ' - ' + name);
              console.log('  ' + (e && e.stack ? e.stack : e));
            }
            browserslist.clearCaches();
          }

          check('caniuse data is loaded', function () {
            assert.ok(Object.keys(browserslist.data).length > 0);
            assert.ok(browserslist.data.chrome);
          });

          check('last 2 versions returns browser strings', function () {
            var result = browserslist('last 2 versions');
            assert.ok(Array.isArray(result));
            assert.ok(result.length > 0);
            result.forEach(function (item) {
              assert.strictEqual(typeof item, 'string');
              assert.ok(/^\S+ \S+$/.test(item), 'bad entry: ' + item);
            });
          });

          check('> 0.5% returns browsers', function () {
            assert.ok(browserslist('> 0.5%').length > 0);
          });

          check('defaults query equals browserslist.defaults', function () {
            assert.deepEqual(browserslist('defaults'), browserslist(browserslist.defaults));
          });

          check('node 10 resolves to a single Node.js 10 release', function () {
            var result = browserslist('node 10');
            assert.strictEqual(result.length, 1);
            assert.strictEqual(result[0].indexOf('node 10.'), 0, 'got: ' + result[0]);
          });

          check('parse splits a composed query', function () {
            var parsed = browserslist.parse('last 1 version, not dead');
            assert.ok(Array.isArray(parsed));
            assert.ok(parsed.length >= 2);
          });

          check('coverage returns a number', function () {
            var coverage = browserslist.coverage(['ie 11'], 'global');
            assert.strictEqual(typeof coverage, 'number');
            assert.ok(coverage >= 0);
          });

          check('parseConfig reads environment sections', function () {
            var config = browserslist.parseConfig(
              '[production]\n> 1%\n[development]\nlast 1 chrome version'
            );
            assert.ok(Object.prototype.hasOwnProperty.call(config, 'production'));
            assert.ok(Object.prototype.hasOwnProperty.call(config, 'development'));
          });

          check('loadConfig returns undefined for an empty directory', function () {
            delete process.env.BROWSERSLIST;
            delete process.env.BROWSERSLIST_CONFIG;
            var dir = fs.mkdtempSync(os.tmpdir() + '/bl-');
            assert.strictEqual(browserslist.loadConfig({ path: dir }), undefined);
          });

          check('unknown query throws', function () {
            assert.throws(function () {
              browserslist('unknown-query-xyz');
            }, /Unknown browser query/);
          });

          check('results are stable across clearCaches', function () {
            var before = browserslist('last 1 version');
            browserslist.clearCaches();
            var after = browserslist('last 1 version');
            assert.deepEqual(after, before);
          });

          console.log('# pass ' + passed);
          console.log('# fail ' + failed);
          if (failed > 0) {
            process.exit(1);
          }
          SMOKE
          node "$RUNNER_TEMP/old-node-smoke.js"
